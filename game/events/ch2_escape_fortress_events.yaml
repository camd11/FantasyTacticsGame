# --- Level Setup ---
level_prep:
  - trigger: on_level_start
    event_name: Setup_Ch2_Fortress
    commands:
      - comment: "Initialize Chapter 2: Escape the Fortress"
      - music: "FortressTheme"  # Match with map property or override
      - weather: None  # Indoor map, so no weather
      # Trigger Indoor Map Auto Dismount
      # In a pure YAML system, this might be a flag the engine checks.
      # If using Python events, you'd call the function.
      # For now, assume the engine handles `is_indoor: true` from the TMX.
      # If specific event call is needed:
      # - call_event: {event_name: "Indoor_Map_Auto_Dismount"} # Assumes this event is registered globally or imported
      - comment: "Indoor_Map_Auto_Dismount should be active due to map property 'is_indoor: true'"

      # Activate Leadership Star Event
      # - call_event: {event_name: "Global_Leadership_Star_Event", condition: "always"} # Assumes global registration
      - comment: "Global_Leadership_Star_Event should be active (typically registered in global_triggers.yaml)"

      # Activate Movement Star Event
      - comment: "Global_Movement_Star_Event should be active (typically registered in global_triggers.yaml)"

      # Activate Global Escape Event
      # - call_event: {event_name: "Global_Escape_Event", condition: "always"} # Assumes global registration
      - comment: "Global_Escape_Event should be active (typically registered in global_triggers.yaml)"
      - display_chapter_title: {title: "Chapter 2", subtitle: "Escape the Fortress"}

