# --- Enemy AI ---
# Basic AI behaviors. More complex AI can be defined here or in separate AI scripts.
enemy_ai_setup:
  - trigger: on_level_start # Or on_enemy_phase_start for dynamic AI changes
    event_name: Setup_Enemy_AI_Ch2
    commands:
      - set_ai_group_behavior:
          group_name: "FortressGuards" # Assign this AI group to enemies in Tiled
          behavior: "guard_area" # Example behavior: stay near post, attack if player in range
          target_area: [[5,5], [15,15]] # Example area
          options: { pursuit_range: 5 }
      - set_ai_group_behavior:
          group_name: "Chasers"
          behavior: "chase_player" # Example: actively pursue player units
          options: { priority_target: "Lord" } # e.g., target Leif

# --- Win Condition: Lord Escapes ---
win_condition_lord_escapes:
  - trigger: on_unit_escape # This trigger would be part of Global_Escape_Event logic
    condition: event.unit.nid == "Leif" and event.region.name.startswith("EscapePoint")
    event_name: Lord_Escaped_Ch2
    commands:
      - comment: "Leif has escaped!"
      - music: "VictoryTheme" # Placeholder
      - dialog:
          speaker: "Leif"
          text: "We made it out! Let's move quickly."
      - win_game

# --- Loss Conditions ---
loss_condition_leif_defeated:
  - trigger: on_unit_death
    condition: event.unit.nid == "Leif"
    event_name: Leif_Defeated_Ch2
    commands:
      - comment: "Leif has been defeated."
      - music: "GameOverTheme" # Placeholder
      - dialog:
          speaker: "Narrator" # Or a surviving ally
          text: "Leif has fallen... Our hopes are lost."
      - game_over

loss_condition_all_players_defeated:
  - trigger: on_phase_end # Check at the end of player or enemy phase
    condition: len(game.get_units_by_team('player')) == 0 and game.turn_count > 0 # Ensure not on turn 0 before deployment
    event_name: All_Players_Defeated_Ch2
    commands:
      - comment: "All player units have been defeated."
      - music: "GameOverTheme" # Placeholder
      - dialog:
          speaker: "Narrator"
          text: "All our forces have been vanquished..."
      - game_over

