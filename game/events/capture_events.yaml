# game/events/capture_events.yaml

# This file outlines the skeleton for the Capture mechanic's events and related skills
# as described in the Lex Talionis "Creating-Capture" tutorial.
# Event scripts are intended for use within the Lex Talionis event editor.
# Skill definitions are conceptual and typically managed in data files (e.g., skills.csv or project.json).

# --- Skills (Conceptual Definitions) ---
# These would typically be in a skills.csv or managed by the engine's database editor.
#
# - NID: CaptureCommand
#   Name: Capture
#   Desc: "Halves STR, MAG, SKL, LCK, SPD for this attack. If foe is defeated and user's CON > foe's CON, capture foe."
#   Components:
#     - type: combat_art # Component key might be just 'combat_art'
#       value: CaptureArtEffect
#     - type: display_name
#       value: Capture
#     # Other relevant components: target_enemy, etc.
#
# - NID: CaptureArtEffect
#   Name: Capture Art Logic (Hidden)
#   Components:
#     - type: event_after_initiated_combat
#       value: Global_Capture_Event
#     - type: stat_halve # Component key might be 'stat_halve' or similar
#       value: "STR,MAG,SKL,LCK,SPD" # Comma-separated string as per tutorial image
#     - type: hidden # Component key might be 'hidden' with a boolean value or just its presence implies true
#       value: true
#     - type: no_animation
#       value: true
#     # - type: combat_art_always_available
#     #   value: true # Or specific availability conditions

# --- Event Definitions ---
# These would be created in the Lex Talionis Event Editor.
# The 'script_lines' below represent the commands entered into the editor.

parsed_event_scripts:
  Global_Capture_Event: # NID for this event script
    name: "Capture Logic" # Display name in editor
    level: Global # Scope of the event
    trigger: None # This event is called directly by the 'CaptureArtEffect' skill
    script_lines:
      # unit = attacker, unit2 = defender
      # Condition: Defender HP <= 0 AND Attacker not already rescuing AND (Attacker CON > Defender CON OR Defender is unarmed/cannot counter)
      - "if;game.get_unit(unit2.nid).get_hp() <= 0 and not unit.traveler and ( (game.get_unit(unit.nid).stats['CON'] > game.get_unit(unit2.nid).stats['CON']) or (not game.get_unit(unit2.nid).get_weapon() or 'cannot_counter' in game.get_unit(unit2.nid).get_weapon().tags) )"
      - "  resurrect;{e:unit2.nid}" # Ensure the unit is 'alive' to be paired up
      - "  change_team;{e:unit2.nid};player" # Temporarily change team to allow pair_up and item trading
      - "  pair_up;{e:unit2.nid};{e:unit.nid}" # Attacker (unit) rescues defender (unit2)
      - "  set_current_hp;{e:unit2.nid};0" # Set to 0 HP so they die if dropped
      - "  give_skill;{e:unit.nid};CarryingPenalty" # Apply carrying penalty to attacker
      - "end"

  Global_Allied_Rescue_Event: # NID for this event script
    name: "Allied Rescue Logic" # Display name in editor
    level: Global # Scope of the event
    trigger: None # This event is called by the 'RescueAllyArtEffect' skill
    script_lines:
      # unit = rescuer, unit2 = target ally
      # Mounted units get +5 CON for rescue check.
      # Condition: Rescuer not already rescuing AND Rescuer CON (+5 if mounted) > Target CON
      - "if;not unit.traveler and ( (game.get_unit(unit.nid).stats['CON'] + (5 if 'Mounted' in game.get_unit(unit.nid).tags else 0)) > game.get_unit(unit2.nid).stats['CON'] ) and game.get_unit(unit.nid).team == game.get_unit(unit2.nid).team and 'Mounted' not in game.get_unit(unit2.nid).tags"
      - "  pair_up;{e:unit2.nid};{e:unit.nid}" # Rescuer (unit) rescues target (unit2)
      - "  give_skill;{e:unit.nid};CarryingPenalty" # Apply general carrying penalty
      - "  if;(game.get_unit(unit2.nid).stats['CON'] > (game.get_unit(unit.nid).stats['CON'] / 2))" # Check for movement penalty
      - "    give_skill;{e:unit.nid};CarryingMovementPenalty" # Apply movement penalty
      - "  end"
      - "end"

  Search_For_Empty_HP: # Optional supporting event from tutorial
    name: "Handle Dropped 0 HP Units (Wait)"
    level: Global
    trigger: unit_wait # Runs when any unit finishes its action
    script_lines:
      # Loop through all units on the map and call 'Kill_Empty_HP_Unit' for each
      - "loop_units;[u.nid for u in game.units if u.position and not u.traveler];Kill_Empty_HP_Unit" # Only check units not currently carrying someone

  Kill_Empty_HP_Unit: # Optional supporting event from tutorial
    name: "Kill Unit if HP is 0"
    level: Global
    trigger: None # Called by 'Search_For_Empty_HP' via loop_units
    script_lines:
      - "if;unit.get_hp() == 0"
      - "  kill_unit;{e:unit.nid}"
      - "end"

  Kill_0_HP_Travelers_End_Chapter: # Optional supporting event from tutorial
    name: "Handle Captured Units at Chapter End"
    level: Global
    trigger: None # Called by a custom loop_units command before 'win_game'
    script_lines:
      # This event is intended to be called by a line like:
      # loop_units;[u.nid for u in game.get_player_units() if u.traveler];Kill_0_HP_Travelers_End_Chapter
      # 'unit.traveler' here refers to the NID of the unit being carried.
      - "if;game.get_unit(unit.traveler) and game.get_unit(unit.traveler).get_hp() == 0"
      - "  kill_unit;{eval:game.get_unit(unit.traveler)};immediate" # eval might be needed if unit.traveler is just a string NID
      - "end"

  Handle_Unit_Stop_Carrying: # NID for this event script
    name: "Handle Unit Stops Carrying"
    level: Global
    trigger: None # To be called by Drop/Transfer commands or a UnitWait check
    # Expects {unit} to be the unit that was carrying
    script_lines:
      - "if;game.get_skill(unit.nid, 'CarryingPenalty')"
      - "  remove_skill;{e:unit.nid};CarryingPenalty"
      - "end"
      - "if;game.get_skill(unit.nid, 'CarryingMovementPenalty')"
      - "  remove_skill;{e:unit.nid};CarryingMovementPenalty"
      - "end"