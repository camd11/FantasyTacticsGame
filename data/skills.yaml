# Skills data for Fantasy Tactics Game
# Based on Fire Emblem: Thracia 776 skills

LEADERSHIP:
  id: "LEADERSHIP"
  name: "Leadership"
  description: "Grants +3 Hit and +3 Avoid to all allied units for each leadership star."
  effects:
    - type: "LEADERSHIP_BONUS"
      params:
        hit_bonus: 3
        avoid_bonus: 3
  activation_condition: "PASSIVE"
  activation_chance: 100

CANTO:
  id: "CANTO"
  name: "Canto"
  description: "Unit can move again after certain actions (not attacking or using staves)."
  effects:
    - type: "MOVE_AFTER_ACTION"
      params:
        excluded_actions: ["ATTACK", "STAFF"]
  activation_condition: "PASSIVE"
  activation_chance: 100

WRATH:
  id: "WRATH"
  name: "Wrath"
  description: "Guarantees a critical hit when counterattacking."
  effects:
    - type: "GUARANTEED_CRITICAL"
      params:
        condition: "COUNTERATTACK"
  activation_condition: "COUNTERATTACK"
  activation_chance: 100

PURSUIT:
  id: "PURSUIT"
  name: "Pursuit"
  description: "Allows unit to perform a follow-up attack if their Attack Speed is at least 4 points higher than the enemy's."
  effects:
    - type: "FOLLOW_UP_ATTACK"
      params:
        speed_difference: 4
  activation_condition: "COMBAT"
  activation_chance: 100

ADEPT:
  id: "ADEPT"
  name: "Adept"
  description: "Gives a chance to perform an extra attack after normal attacks."
  effects:
    - type: "EXTRA_ATTACK"
      params: {}
  activation_condition: "COMBAT"
  activation_chance: "SKILL"

STEAL:
  id: "STEAL"
  name: "Steal"
  description: "Allows unit to steal items from enemies if their Speed is higher and the item's weight is less than their Con."
  effects:
    - type: "ENABLE_STEAL_COMMAND"
      params: {}
  activation_condition: "PASSIVE"
  activation_chance: 100

CHARISMA:
  id: "CHARISMA"
  name: "Charisma"
  description: "Grants +10 Hit and +10 Avoid to all allied units within 3 tiles."
  effects:
    - type: "AURA_BONUS"
      params:
        hit_bonus: 10
        avoid_bonus: 10
        range: 3
  activation_condition: "PASSIVE"
  activation_chance: 100

NIHIL:
  id: "NIHIL"
  name: "Nihil"
  description: "Negates enemy combat skills and critical hits."
  effects:
    - type: "NEGATE_SKILLS"
      params: {}
    - type: "NEGATE_CRITICAL"
      params: {}
  activation_condition: "PASSIVE"
  activation_chance: 100

PRAYER:
  id: "PRAYER"
  name: "Prayer"
  description: "When HP is 10 or below, enemy hit rate becomes 0%."
  effects:
    - type: "SET_ENEMY_HIT_ZERO"
      params:
        hp_threshold: 10
  activation_condition: "HP_BELOW_THRESHOLD"
  activation_chance: 100

MOVEMENT_STARS:
  id: "MOVEMENT_STARS"
  name: "Movement Stars"
  description: "Each star gives a 5% chance to act again after completing an action."
  effects:
    - type: "EXTRA_TURN_CHANCE"
      params:
        chance_per_star: 5
  activation_condition: "END_OF_ACTION"
  activation_chance: "STARS_BASED"

VANTAGE:
  id: "VANTAGE"
  name: "Vantage"
  description: "Unit attacks first when being attacked, even during enemy phase."
  effects:
    - type: "ATTACK_FIRST"
      params:
        condition: "WHEN_ATTACKED"
  activation_condition: "COMBAT"
  activation_chance: 100

ASTRA:
  id: "ASTRA"
  name: "Astra"
  description: "Allows unit to strike 5 consecutive attacks at half damage. Also known as Shooting Star."
  effects:
    - type: "MULTI_ATTACK"
      params:
        num_attacks: 5
        damage_multiplier: 0.5
  activation_condition: "COMBAT"
  activation_chance: "SKILL"

SOL:
  id: "SOL"
  name: "Sol"
  description: "Heals the user by the amount of damage dealt to the enemy. Also known as Sun Sword."
  effects:
    - type: "HEAL_FROM_DAMAGE"
      params:
        heal_percent: 100
  activation_condition: "COMBAT"
  activation_chance: "SKILL"

LUNA:
  id: "LUNA"
  name: "Luna"
  description: "Ignores enemy's defense when calculating damage. Also known as Moon Sword."
  effects:
    - type: "IGNORE_DEFENSE"
      params: {}
  activation_condition: "COMBAT"
  activation_chance: "SKILL"

PAVISE:
  id: "PAVISE"
  name: "Pavise"
  description: "Completely negates an incoming attack's damage. Also known as Big Shield."
  effects:
    - type: "NEGATE_DAMAGE"
      params: {}
  activation_condition: "WHEN_ATTACKED"
  activation_chance: "SKILL"

CANTO_PLUS:
  id: "CANTO_PLUS"
  name: "Canto+"
  description: "Unit can move again after any action, including attacking and using staves."
  effects:
    - type: "MOVE_AFTER_ACTION"
      params:
        excluded_actions: []
  activation_condition: "PASSIVE"
  activation_chance: 100