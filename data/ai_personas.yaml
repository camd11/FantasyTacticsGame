# AI Persona Definitions
# 
# This file defines the behavioral characteristics of different AI unit types
# through weighted preferences for different goals and considerations.
#
# Each persona has three sets of weights:
# - goal_weights: Influence which goals are prioritized during Strategic Evaluation
# - strategic_weights: Influence how goals are scored during Strategic Evaluation
# - tactical_weights: Influence how actions are scored during Tactical Execution

