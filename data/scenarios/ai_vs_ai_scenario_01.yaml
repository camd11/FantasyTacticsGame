  # AI Team 2 (Enemy faction)
  - unit_id: MAREETA
    faction: ENEMY
    position: [6, 5]  # Moved closer to center
    level: 10
    start_inventory:
      - IRON_SWORD
      - STEEL_SWORD
    stats_override:
      HP: 28
      current_hp: 28
      STR: 13
      SKL: 14
      SPD: 16
      DEF: 7
    ai_persona: AGGRESSOR  # Aggressive AI persona
    
  - unit_id: DAGDAR
    faction: ENEMY
    position: [7, 5]  # Moved closer to center
    level: 10
    start_inventory:
      - IRON_AXE
      - STEEL_AXE
    stats_override:
      HP: 40
      current_hp: 40
      STR: 16
      SKL: 10
      SPD: 7
      DEF: 14
    ai_persona: DEFENDER  # Defensive AI persona
    
  - unit_id: SAIAS
    faction: ENEMY
    position: [6, 6]  # Moved closer to center
    level: 10
    start_inventory:
      - PHYSIC
    stats_override:
      HP: 26
      current_hp: 26
      MAG: 12
      SKL: 9
      SPD: 10
      DEF: 6
    ai_persona: SUPPORT  # Support AI persona
    
  - unit_id: TANYA
    faction: ENEMY
    position: [5, 6]  # Moved closer to center
    level: 10
    start_inventory:
      - IRON_BOW
      - STEEL_BOW
    stats_override:
      HP: 27
      current_hp: 27
      STR: 11
      SKL: 13
      SPD: 14
      DEF: 6
    ai_persona: OBJECTIVE-FOCUSED  # Objective-focused AI persona

# Objectives for the scenario
objectives:
  - type: DEFEAT_ALL
    faction: PLAYER
    description: "Defeat all enemy units"
  - type: DEFEAT_ALL
    faction: ENEMY
    description: "Defeat all player units"
  - type: SEIZE
    position: [2, 2]
    faction: ENEMY
    description: "Seize the mountain fortress (for enemy)"
  - type: SEIZE
    position: [7, 7]
    faction: PLAYER
    description: "Seize the mountain fortress (for player)"

# Test assertions
test_assertions:
  # Test that Aggressor prioritizes attacking
  - type: AI_GOAL_SELECTION
    unit_id: LEIF
    expected:
      selected_goal_type: ATTACK_UNIT
      
  - type: AI_GOAL_SELECTION
    unit_id: MAREETA
    expected:
      selected_goal_type: ATTACK_UNIT
      
  # Test that Defender prioritizes securing position on defensive terrain
  - type: AI_GOAL_SELECTION
    unit_id: FINN
    expected:
      selected_goal_type: SECURE_POSITION
      
  - type: AI_GOAL_SELECTION
    unit_id: DAGDAR
    expected:
      selected_goal_type: SECURE_POSITION
      
  # Test that Support prioritizes healing allies
  - type: AI_GOAL_SELECTION
    unit_id: NANNA
    expected:
      selected_goal_type: HEAL_UNIT
      
  - type: AI_GOAL_SELECTION
    unit_id: SAIAS
    expected:
      selected_goal_type: HEAL_UNIT
      
  # Test that Objective-focused prioritizes advancing to objective
  - type: AI_GOAL_SELECTION
    unit_id: HALVAN
    expected:
      selected_goal_type: ADVANCE_TO_OBJECTIVE
      
  - type: AI_GOAL_SELECTION
    unit_id: TANYA
    expected:
      selected_goal_type: ADVANCE_TO_OBJECTIVE

# Instructions for manual verification
verification_instructions: |
  This scenario tests AI vs AI combat with different AI personas on both teams.
  
  To verify the AI behavior:
  
  1. Start the scenario and observe the initial state:
     - Both teams have a mix of AI personas (Aggressor, Defender, Support, Objective-Focused)
     - The map has varied terrain to create interesting tactical situations
  
  2. Run the simulation for several turns and observe:
     - How different AI personas interact with each other
     - How the two AI teams develop their strategies
     - Whether units with the same persona on different teams behave similarly
  
  3. Specific behaviors to watch for:
     - LEIF and MAREETA (Aggressors) should prioritize attacking enemy units
     - FINN and DAGDAR (Defenders) should prioritize moving to or staying on forest/mountain tiles
     - NANNA and SAIAS (Support) should prioritize healing any damaged allies
     - HALVAN and TANYA (Objective-Focused) should prioritize moving toward their respective objectives
  
  4. The AI debug log should show:
     - Goal selection for each unit based on their persona
     - Tactical action execution to achieve those goals
     - How the AI adapts as the battle situation changes
  
  This test scenario helps evaluate how the Two-Phase Goal-Oriented Utility AI
  architecture performs in a pure AI vs AI combat situation, which is useful for
  automated testing and balancing of the AI system.

# AI logging settings
ai_logging:
  enabled: true
  detail_level: DETAILED  # Options: TERSE, NORMAL, DETAILED
  log_to_file: true
  log_filename: "ai_vs_ai_test_01.log"