# AI vs AI Test Scenario 01
# Tests the Two-Phase Goal-Oriented Utility AI's behavior in AI vs AI combat

# Map definition
id: ai_vs_ai_scenario_01
name: AI vs AI Combat Test
dimensions: [10, 10]
terrain_grid:
  - [P, P, P, P, P, P, P, P, P, P]  # P = Plain
  - [P, F, F, P, P, P, P, F, F, P]  # F = Forest (defensive terrain)
  - [P, F, M, F, P, P, F, M, F, P]  # M = Mountain (high defense)
  - [P, P, F, P, P, P, P, F, P, P]
  - [P, P, P, P, R, B, P, P, P, P]  # R = River, B = Bridge
  - [P, P, P, P, B, R, P, P, P, P]
  - [P, P, F, P, P, P, P, F, P, P]
  - [P, F, M, F, P, P, F, M, F, P]
  - [P, F, F, P, P, P, P, F, F, P]
  - [P, P, P, P, P, P, P, P, P, P]

# Unit placements
placements:
  # AI Team 1 (Player faction but AI-controlled)
  - unit_id: LEIF
    faction: PLAYER
    position: [3, 4]  # Moved closer to center
    level: 10
    start_inventory:
      - IRON_SWORD
      - RAPIER
    stats_override:
      HP: 30
      current_hp: 30
      STR: 12
      SKL: 10
      SPD: 11
      DEF: 8
    ai_persona: AGGRESSOR  # Aggressive AI persona for the leader
    
  - unit_id: FINN
    faction: PLAYER
    position: [2, 4]  # Moved closer to center
    level: 10
    start_inventory:
      - IRON_LANCE
      - JAVELIN
    stats_override:
      HP: 32
      current_hp: 32
      STR: 14
      SKL: 12
      SPD: 13
      DEF: 10
    ai_persona: DEFENDER  # Defensive AI persona
    
  - unit_id: NANNA
    faction: PLAYER
    position: [3, 3]  # Moved closer to center
    level: 10
    start_inventory:
      - PHYSIC
    stats_override:
      HP: 25
      current_hp: 25
      MAG: 10
      SKL: 8
      SPD: 9
      DEF: 5
    ai_persona: SUPPORT  # Support AI persona
    
  - unit_id: HALVAN
    faction: PLAYER
    position: [4, 3]  # Moved closer to center
    level: 10
    start_inventory:
      - IRON_AXE
