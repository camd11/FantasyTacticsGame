# AI Manager Heal Support Scenario
# Tests the HEAL_SUPPORT AI behavior type which prioritizes healing critically injured allies and removing status effects

# Map definition
id: heal_support_ai_test
name: Heal Support AI Test
map_size: [10, 10]
terrain_grid:
  - [P, P, P, P, P, P, P, P, P, P]
  - [P, P, P, P, P, P, P, P, P, P]
  - [P, P, P, P, P, P, P, P, P, P]
  - [P, P, P, P, P, P, P, P, P, P]
  - [P, P, P, P, P, P, P, P, P, P]
  - [P, P, P, P, P, P, P, P, P, P]
  - [P, P, P, P, P, P, P, P, P, P]
  - [P, P, P, P, P, P, P, P, P, P]
  - [P, P, P, P, P, P, P, P, P, P]
  - [P, P, P, P, P, P, P, P, P, P]

# Unit placements
units:
  # Enemy healer with healing staves
  - id: enemy_healer
    name: Enemy Healer
    faction: ENEMY
    position: [5, 2]
    stats:
      HP: 25
      STR: 5
      MAG: 12
      SKL: 10
      SPD: 8
      LUK: 7
      DEF: 4
      RES: 10
      MOV: 5
    current_hp: 25
    inventory:
      - item: HEAL_STAFF
        uses: 20
      - item: PHYSIC_STAFF
        uses: 10
      - item: RESTORE_STAFF
        uses: 5

  # Enemy fighter 1 - Slightly injured (70% HP)
  - id: enemy_fighter1
    name: Enemy Fighter 1
    faction: ENEMY
    position: [3, 2]
    stats:
      HP: 30
      STR: 12
      MAG: 2
      SKL: 8
      SPD: 7
      LUK: 5
      DEF: 8
      RES: 3
      MOV: 5
    current_hp: 21  # 70% of max HP

  # Enemy fighter 2 - Critically injured (20% HP)
  - id: enemy_fighter2
    name: Enemy Fighter 2
    faction: ENEMY
    position: [4, 3]
    stats:
      HP: 30
      STR: 13
      MAG: 2
      SKL: 9
      SPD: 6
      LUK: 4
      DEF: 9
      RES: 2
      MOV: 5
    current_hp: 6  # 20% of max HP

  # Enemy mage with SLEEP status effect
  - id: enemy_mage
    name: Enemy Mage
    faction: ENEMY
    position: [6, 3]
    stats:
      HP: 22
      STR: 3
      MAG: 10
      SKL: 7
      SPD: 9
      LUK: 6
      DEF: 3
      RES: 8
      MOV: 5
    current_hp: 22
    status_effects:
      - type: SLEEP
        duration: 3

  # Player unit for testing
  - id: player_unit
    name: Player Unit
    faction: PLAYER
    position: [7, 7]
    stats:
      HP: 28
      STR: 10
      MAG: 5
      SKL: 9
      SPD: 10
      LUK: 8
      DEF: 7
      RES: 5
      MOV: 6
    current_hp: 28

# Initial state
initial_state:
  turn: 1
  phase: ENEMY
  active_unit: enemy_healer

# Turn sequence
turn_sequence:
  - faction: ENEMY
    expected_actions:
      - unit_id: enemy_healer
        action_type: ITEM
        target_unit_id: enemy_fighter2  # Should prioritize critically injured ally
        item_id: HEAL_STAFF

# Verification instructions
verification_instructions: |
  This scenario tests the HEAL_SUPPORT AI behavior type. The AI should:
  
  1. Prioritize healing the critically injured ally (enemy_fighter2) first
  2. After critical healing is done, prioritize removing status effects (enemy_mage with SLEEP)
  3. Move to reach healing targets that are out of range
  
  Expected behavior:
  - The healer should move to heal enemy_fighter2 first (critically injured)
  - If enemy_fighter2 is fully healed, the healer should prioritize using RESTORE_STAFF on enemy_mage
  - If both critical healing and status removal are done, the healer should heal enemy_fighter1