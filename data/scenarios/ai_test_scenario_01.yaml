# AI Test Scenario 01: Strategic Goal Selection
# Tests the Two-Phase Goal-Oriented Utility AI's ability to select appropriate goals based on AI personas

# Map definition
id: ai_test_scenario_01
name: AI Persona Goal Selection Test
dimensions: [8, 8]
terrain_grid:
  - [P, P, P, P, P, P, P, P]  # P = Plain
  - [P, P, P, F, F, P, P, P]  # F = Forest (defensive terrain)
  - [P, P, F, F, F, F, P, P]
  - [P, P, F, M, M, F, P, P]  # M = Mountain (high defense)
  - [P, P, F, M, M, F, P, P]
  - [P, P, F, F, F, F, P, P]
  - [P, P, P, F, F, P, P, P]
  - [P, P, P, P, P, P, P, P]

# Unit placements
placements:
  # Player units
  - unit_id: LEIF  # Player commander
    faction: PLAYER
    position: [1, 3]
    level: 10
    start_inventory:
      - IRON_SWORD
    stats_override:
      HP: 30
      current_hp: 15  # Half health to test healing priorities
      STR: 12
      SKL: 10
      SPD: 11
      DEF: 8
      
  - unit_id: FINN  # Player lance unit
    faction: PLAYER
    position: [2, 4]
    level: 10
    start_inventory:
      - IRON_LANCE
    stats_override:
      HP: 32
      current_hp: 32  # Full health
      STR: 14
      SKL: 12
      SPD: 13
      DEF: 10
      
  # Enemy units with different AI personas
  - unit_id: ENEMY_FIGHTER  # Aggressor persona
    faction: ENEMY
    position: [6, 3]
    level: 10
    start_inventory:
      - IRON_AXE
    stats_override:
      HP: 30
      STR: 14
      SKL: 8
      SPD: 7
      DEF: 9
    ai_persona: AGGRESSOR  # Should prioritize attacking player units
    
  - unit_id: ENEMY_KNIGHT  # Defender persona
    faction: ENEMY
    position: [5, 5]
    level: 10
    start_inventory:
      - IRON_LANCE
    stats_override:
      HP: 35
      STR: 12
      SKL: 7
      SPD: 5
      DEF: 15
    ai_persona: DEFENDER  # Should prioritize holding defensive terrain
    
  - unit_id: ENEMY_CLERIC  # Support persona
    faction: ENEMY
    position: [6, 4]
    level: 10
    start_inventory:
      - HEAL_STAFF
    stats_override:
      HP: 24
      MAG: 10
      SKL: 8
      SPD: 9
      DEF: 4
    ai_persona: SUPPORT  # Should prioritize healing allies
    
  - unit_id: ENEMY_THIEF  # Objective-focused persona
    faction: ENEMY
    position: [6, 6]
    level: 10
    start_inventory:
      - IRON_SWORD
    stats_override:
      HP: 25
      STR: 9
      SKL: 12
      SPD: 14
      DEF: 5
    ai_persona: OBJECTIVE-FOCUSED  # Should prioritize moving toward objectives

# Test assertions
test_assertions:
  # Test that Aggressor prioritizes attacking
  - type: AI_GOAL_SELECTION
    unit_id: ENEMY_FIGHTER
    expected:
      selected_goal_type: ATTACK_UNIT
      
  # Test that Defender prioritizes securing position on defensive terrain
  - type: AI_GOAL_SELECTION
    unit_id: ENEMY_KNIGHT
    expected:
      selected_goal_type: SECURE_POSITION
      
  # Test that Support prioritizes healing allies
  - type: AI_GOAL_SELECTION
    unit_id: ENEMY_CLERIC
    expected:
      selected_goal_type: HEAL_UNIT
      target_unit_id: ENEMY_FIGHTER  # Assuming ENEMY_FIGHTER takes damage during testing
      
  # Test that Objective-focused prioritizes advancing to objective
  - type: AI_GOAL_SELECTION
    unit_id: ENEMY_THIEF
    expected:
      selected_goal_type: ADVANCE_TO_OBJECTIVE

# Objectives for the scenario
objectives:
  - type: SEIZE
    position: [1, 1]
    faction: ENEMY  # Enemy units should try to reach this position

# Instructions for manual verification
verification_instructions: |
  This scenario tests the AI's Strategic Goal Selection phase based on different AI personas.
  
  To verify the AI behavior:
  
  1. Start the scenario and observe the initial state:
     - ENEMY_FIGHTER (Aggressor) should be positioned to attack player units
     - ENEMY_KNIGHT (Defender) should be positioned on defensive terrain
     - ENEMY_CLERIC (Support) should be positioned to heal allies
     - ENEMY_THIEF (Objective-focused) should be positioned to advance toward the objective
  
  2. End your turn to allow the enemy phase to begin.
  
  3. During the enemy phase, observe each AI unit's behavior:
     - ENEMY_FIGHTER should prioritize attacking LEIF or FINN, even if it means moving away from defensive terrain
     - ENEMY_KNIGHT should prioritize moving to or staying on forest/mountain tiles, even if attack opportunities exist
     - ENEMY_CLERIC should prioritize healing any damaged ally (you may need to damage an enemy unit first)
     - ENEMY_THIEF should prioritize moving toward the objective at [1,1], even if attack opportunities exist
  
  4. The AI debug log should show:
     - For ENEMY_FIGHTER: "Selected Goal: ATTACK_UNIT" with a high score
     - For ENEMY_KNIGHT: "Selected Goal: SECURE_POSITION" with a high score
     - For ENEMY_CLERIC: "Selected Goal: HEAL_UNIT" with a high score (if allies are damaged)
     - For ENEMY_THIEF: "Selected Goal: ADVANCE_TO_OBJECTIVE" with a high score
  
  This confirms that the Strategic Evaluator is correctly selecting goals based on AI personas,
  which is the first phase of the Two-Phase Goal-Oriented Utility AI architecture.