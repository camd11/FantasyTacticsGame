# Fatigue Accumulation Test Scenario
# Tests the Fatigue system which accumulates as units perform actions and can prevent deployment

# Map definition
id: fatigue_accumulation_test
name: Fatigue Accumulation Test
dimensions: [7, 7]
terrain_grid:
  - [P, P, P, P, P, P, P]
  - [P, P, P, P, P, P, P]
  - [P, P, P, P, P, P, P]
  - [P, P, P, P, P, P, P]
  - [P, P, P, P, P, P, P]
  - [P, P, P, P, P, P, P]
  - [P, P, P, P, P, P, P]

# Unit placements
placements:
  # Player unit that will accumulate fatigue
  - unit_id: FINN
    faction: PLAYER
    position: [1, 1]
    level: 10
    starting_fatigue: 0  # Start with no fatigue
    start_inventory:
      - IRON_LANCE
    stats_override:
      HP: 20  # Set HP to 20 to easily observe fatigue threshold
      STR: 10
      SKL: 10
      SPD: 10
      LUK: 10
      DEF: 10
      
  # Enemy units for the player to attack
  - unit_id: ENEMY_SOLDIER_1
    faction: ENEMY
    position: [3, 1]
    level: 5
    start_inventory:
      - IRON_LANCE
    stats_override:
      HP: 15
      DEF: 5
      
  - unit_id: ENEMY_SOLDIER_2
    faction: ENEMY
    position: [3, 3]
    level: 5
    start_inventory:
      - IRON_LANCE
    stats_override:
      HP: 15
      DEF: 5
      
  - unit_id: ENEMY_SOLDIER_3
    faction: ENEMY
    position: [3, 5]
    level: 5
    start_inventory:
      - IRON_LANCE
    stats_override:
      HP: 15
      DEF: 5

# Test assertions
test_assertions:
  # Test that fatigue increases after combat
  - type: FATIGUE_CHANGE
    unit_id: FINN
    action: COMBAT
    expected:
      fatigue_increase: 1
      
  # Test that fatigue accumulates over multiple actions
  - type: FATIGUE_ACCUMULATION
    unit_id: FINN
    actions: [COMBAT, WAIT, COMBAT, WAIT, COMBAT]
    expected:
      total_fatigue: 3  # 3 combat actions = 3 fatigue
      
  # Test that fatigue persists between turns
  - type: FATIGUE_PERSISTENCE
    unit_id: FINN
    turns: 3
    expected:
      fatigue_retained: true

# Instructions for manual verification
verification_instructions: |
  To verify the Fatigue system:
  
  1. Start the scenario and observe the initial fatigue of FINN (should be 0).
  
  2. Move FINN adjacent to ENEMY_SOLDIER_1 and attack. After combat:
     - Check FINN's status screen to see fatigue increased by 1
     - The log should show a message about fatigue increasing
  
  3. End the turn and start a new player phase.
  
  4. Move FINN adjacent to ENEMY_SOLDIER_2 and attack. After combat:
     - Check FINN's status screen to see fatigue increased to 2
     - The log should show another message about fatigue increasing
  
  5. End the turn and start a new player phase.
  
  6. Move FINN adjacent to ENEMY_SOLDIER_3 and attack. After combat:
     - Check FINN's status screen to see fatigue increased to 3
     - The log should show another message about fatigue increasing
  
  7. Continue for several more turns, having FINN move and wait each turn.
     - Observe that fatigue continues to accumulate with each action
     - Fatigue should persist between turns and not reset
  
  8. If you continue until FINN's fatigue reaches or exceeds his max HP (20):
     - At the end of the chapter, FINN would be marked as fatigued
     - In the next chapter, FINN would not be deployable (except for Leif who is exempt)
  
  Note: The fatigue system is only active from Chapter 8 onwards in the main game.
  This test scenario forces fatigue to be active regardless of chapter number.
  
  Key observations:
  - Combat actions increase fatigue by 1
  - Fatigue accumulates over multiple actions and turns
  - When fatigue ≥ max HP, a unit becomes fatigued for the next chapter
  - Fatigue is displayed on the unit's status screen and in the log