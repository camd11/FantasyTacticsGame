# Heal Support AI Test Scenario
name: "Heal Support AI Test"
description: "Test scenario for the HEAL_SUPPORT AI archetype"
map_size: [10, 10]
turn_limit: 10

# Terrain setup
terrain:
  default: "PLAINS"
  custom:
    - coord: [2, 2]
      type: "FOREST"
    - coord: [3, 3]
      type: "MOUNTAIN"
    - coord: [5, 5]
      type: "FORT"

# Units setup
units:
  # Enemy healer with HEAL_SUPPORT AI
  - id: "enemy_healer"
    name: "Enemy Cleric"
    class: "CLERIC"
    level: 5
    faction: "ENEMY"
    position: [5, 1]
    stats:
      HP: 20
      STR: 2
      MAG: 8
      SKL: 7
      SPD: 8
      LCK: 6
      DEF: 3
      RES: 8
      CON: 5
      MOV: 5
    inventory:
      - item: "HEAL_STAFF"
        uses: 30
      - item: "MEND_STAFF"
        uses: 15
      - item: "PHYSIC_STAFF"
        uses: 10
      - item: "RESTORE_STAFF"
        uses: 8
    ai_profile:
      behavior_type: "HEAL_SUPPORT"
      target_priority: "WEAKEST"
      aggression: 30
      heal_threshold_ally: 0.7  # Heal allies below 70% HP
      heal_threshold_self: 0.5  # Prioritize self-healing below 50% HP
      retreat_threshold: 0.3    # Retreat when below 30% HP
      use_status_staves: true

  # Enemy units with varying HP levels
  - id: "enemy_fighter1"
    name: "Injured Fighter"
    class: "FIGHTER"
    level: 5
    faction: "ENEMY"
    position: [3, 1]
    stats:
      HP: 30
      STR: 9
      MAG: 0
      SKL: 7
      SPD: 6
      LCK: 5
      DEF: 6
      RES: 2
      CON: 10
      MOV: 5
    current_hp: 15  # 50% HP
    inventory:
      - item: "IRON_AXE"
        uses: 45

  - id: "enemy_fighter2"
    name: "Critical Fighter"
    class: "FIGHTER"
    level: 5
    faction: "ENEMY"
    position: [7, 1]
    stats:
      HP: 30
      STR: 9
      MAG: 0
      SKL: 7
      SPD: 6
      LCK: 5
      DEF: 6
      RES: 2
      CON: 10
      MOV: 5
    current_hp: 6  # 20% HP - critically injured
    inventory:
      - item: "IRON_AXE"
        uses: 45

  - id: "enemy_mage"
    name: "Sleeping Mage"
    class: "MAGE"
    level: 5
    faction: "ENEMY"
    position: [6, 3]
    stats:
      HP: 22
      STR: 1
      MAG: 8
      SKL: 7
      SPD: 8
      LCK: 6
      DEF: 2
      RES: 7
      CON: 5
      MOV: 5
    current_hp: 18  # 82% HP - not injured much but has status effect
    status_effects:
      - type: "SLEEP"
        duration: 3
    inventory:
      - item: "FIRE"
        uses: 30

  - id: "enemy_archer"
    name: "Healthy Archer"
    class: "ARCHER"
    level: 5
    faction: "ENEMY"
    position: [4, 2]
    stats:
      HP: 25
      STR: 7
      MAG: 0
      SKL: 9
      SPD: 7
      LCK: 5
      DEF: 5
      RES: 3
      CON: 7
      MOV: 5
    current_hp: 25  # 100% HP - fully healthy
    inventory:
      - item: "IRON_BOW"
        uses: 45

  # Player units
  - id: "player_lord"
    name: "Player Lord"
    class: "LORD"
    level: 8
    faction: "PLAYER"
    position: [5, 8]
    stats:
      HP: 28
      STR: 10
      MAG: 2
      SKL: 11
      SPD: 12
      LCK: 9
      DEF: 8
      RES: 5
      CON: 8
      MOV: 6
    inventory:
      - item: "SILVER_SWORD"
        uses: 30
      - item: "IRON_SWORD"
        uses: 46
      - item: "VULNERARY"
        uses: 3

  - id: "player_cavalier"
    name: "Player Cavalier"
    class: "CAVALIER"
    level: 7
    faction: "PLAYER"
    position: [3, 7]
    stats:
      HP: 30
      STR: 9
      MAG: 1
      SKL: 8
      SPD: 9
      LCK: 6
      DEF: 9
      RES: 4
      CON: 9
      MOV: 7
    inventory:
      - item: "IRON_LANCE"
        uses: 45
      - item: "JAVELIN"
        uses: 20

# Test expectations
expectations:
  # The healer should prioritize healing the critically injured fighter
  - turn: 1
    unit_id: "enemy_healer"
    expected_action:
      type: "ITEM"
      target_unit_id: "enemy_fighter2"
      item_id: "MEND_STAFF"  # Should use Mend for more healing
  
  # After the critical fighter is healed, should prioritize the sleeping mage to remove status
  - turn: 2
    unit_id: "enemy_healer"
    expected_action:
      type: "ITEM"
      target_unit_id: "enemy_mage"
      item_id: "RESTORE_STAFF"
  
  # Then should heal the injured fighter
  - turn: 3
    unit_id: "enemy_healer"
    expected_action:
      type: "ITEM"
      target_unit_id: "enemy_fighter1"
      item_id: "HEAL_STAFF"  # Regular Heal is sufficient