# AI vs AI Test Scenario - Simplified
# Tests basic AI interaction with minimal units to reduce logging.

# Map definition
id: ai_vs_ai_scenario_simplified
name: AI vs AI Simplified Test
dimensions: [10, 10]
terrain_grid:
  - [P, P, P, P, P, P, P, P, P, P]  # P = Plain
  - [P, P, P, P, P, P, P, P, P, P]
  - [P, P, P, P, P, P, P, P, P, P]
  - [P, P, P, P, P, P, P, P, P, P]
  - [P, P, P, P, P, P, P, P, P, P]
  - [P, P, P, P, P, P, P, P, P, P]
  - [P, P, P, P, P, P, P, P, P, P]
  - [P, P, P, P, P, P, P, P, P, P]
  - [P, P, P, P, P, P, P, P, P, P]
  - [P, P, P, P, P, P, P, P, P, P]

# Unit placements
placements:
  # AI Team 1 (Player faction but AI-controlled)
  - unit_id: LEIF
    faction: PLAYER
    position: [2, 4]
    level: 10
    start_inventory:
      - IRON_SWORD
    stats_override:
      HP: 30
      current_hp: 30
      STR: 12
      SKL: 10
      SPD: 11
      DEF: 8
    ai_persona: AGGRESSOR

  # AI Team 2 (Enemy faction)
  - unit_id: MAREETA
    faction: ENEMY
    position: [7, 4]
    level: 10
    start_inventory:
      - IRON_SWORD
    stats_override:
      HP: 28
      current_hp: 28
      STR: 13
      SKL: 14
      SPD: 16
      DEF: 7
    ai_persona: AGGRESSOR

# Objectives for the scenario
objectives:
  - type: DEFEAT_ALL
    faction: PLAYER
    description: "Defeat all enemy units"
  - type: DEFEAT_ALL
    faction: ENEMY
    description: "Defeat all player units"

# AI logging settings (Keep detailed for debugging specific AI issues if needed)
ai_logging:
  enabled: true
  detail_level: NORMAL # Reduced from DETAILED
  log_to_file: true
  log_filename: "ai_vs_ai_simplified.log" # Use a specific log file