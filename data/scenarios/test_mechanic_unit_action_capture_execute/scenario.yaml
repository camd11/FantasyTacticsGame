# Capture Execute Test Scenario
# Tests the execution of the Capture command

# Scenario metadata
id: test_mechanic_unit_action_capture_execute
name: Capture Execute Test

# Instructions for manual verification
verification_instructions: |
  This scenario tests the execution of the Capture command.
  
  1. The player unit (Fighter) has high CON (8) and is positioned adjacent to 
     an enemy unit with low HP (5) and lower CON (6).
  
  2. Select the player unit and use the Capture command to target the enemy unit.
     The capture should succeed because:
     - The player unit has higher CON than the enemy unit
     - The player unit is not mounted
     - The enemy unit is not mounted
     - The enemy unit's CON is less than 20
     - The enemy unit's HP is low enough to be defeated in combat
  
  3. After successful capture, verify:
     - The player unit's status changes to "Carrying"
     - The player unit's stats are halved (STR, MAG, SKL, SPD, DEF)
     - The captured enemy unit has 1 HP and status "Captured"
  
  4. You can then test item stealing by positioning another unit adjacent to the
     capturer and initiating a trade.